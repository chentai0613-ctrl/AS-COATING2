<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS COATING｜營運管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f3f1ec;
  --ink:#37433d;
  --muted:#818a84;
  --line:#e8e6df;
  --green:#648875;
  --orange:#c58a55;
  --blue:#698db5;
  --red:#c36e70;
  --purple:#9278ad;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;max-width:100%;min-height:100%;
  overflow-x:hidden;
}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}
button,input,select,textarea{font:inherit}
button{
  cursor:pointer;border:0;border-radius:9px;
  padding:10px 14px;max-width:100%;
}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#71877b;color:white}
.secondary{background:#edf0ec;color:#425248}
.danger{background:#f8e8e6;color:#b84242}
.purple-btn{background:#eee8f5;color:#755d91}
.hidden{display:none!important}

/* 登入畫面 */
#loginPage{
  min-height:100vh;display:grid;place-items:center;
  background:linear-gradient(135deg,#e9e5dc,#d9e3dc,#e8e1ec);
  padding:20px;
}
.login-card{
  background:white;width:100%;max-width:430px;padding:38px;
  border-radius:22px;text-align:center;
  box-shadow:0 12px 40px #26372c12;
}
.logo{font-size:27px;font-weight:900;letter-spacing:4px}
.sublogo{
  font-size:11px;letter-spacing:3px;color:var(--muted);
  margin:8px 0 28px;
}
.login-card button{width:100%;margin-top:10px}

/* 頂部及主架構 */
.topbar{
  min-height:66px;background:white;display:flex;
  align-items:center;justify-content:space-between;
  padding:10px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;gap:12px;
}
.topbar .logo{font-size:19px;letter-spacing:2px}
.user-area{display:flex;align-items:center;gap:12px;min-width:0}
.userbox{
  text-align:right;font-size:12px;color:var(--muted);
  line-height:1.7;overflow-wrap:anywhere;
}
.mode{
  font-size:11px;border-radius:20px;padding:4px 9px;
  background:#edf0ec;margin-left:8px;white-space:nowrap;
}
.layout{display:flex;min-height:calc(100vh - 66px);width:100%}
.sidebar{
  width:215px;flex-shrink:0;background:#e8e9e2;padding:18px 12px;
}
.nav-label{font-size:11px;color:var(--muted);padding:12px}
.nav{
  display:block;width:100%;text-align:left;background:transparent;
  color:#526057;margin:3px 0;padding:12px;
}
.nav.active,.nav:hover{
  background:white;color:#536b60;font-weight:bold;
}
.main{padding:26px;flex:1;min-width:0;width:100%}
.page-title{font-size:24px;font-weight:800;margin:0 0 5px}
.page-desc{
  font-size:13px;color:var(--muted);margin:5px 0 20px;
  line-height:1.7;
}
.page-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:15px;
}
.back-dashboard{background:#e9eee9;color:#526b5c;font-weight:700}

/* 營運總覽與模組欄位 */
.dashboard-heading{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;
}
.month-picker{
  display:flex;align-items:center;gap:9px;
  background:white;padding:8px 12px;border-radius:11px;
}
.month-picker label{font-size:12px;color:var(--muted)}
.month-picker input{border:0;padding:5px;max-width:155px}
.metrics{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:13px;margin-bottom:20px;
}
.metric{
  position:relative;overflow:hidden;border-radius:15px;
  padding:18px;background:white;box-shadow:0 5px 22px #29382f08;
  cursor:pointer;transition:.2s;border:1px solid transparent;
  min-width:0;
}
.metric:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 25px #29382f15;
}
.metric:after{
  content:"";position:absolute;right:-20px;top:-25px;
  width:85px;height:85px;border-radius:50%;
  opacity:.13;background:currentColor;pointer-events:none;
}
.metric-label{font-size:12px;color:#68736c}
.metric-value{
  font-size:23px;font-weight:900;margin-top:10px;
  overflow-wrap:anywhere;
}
.metric-note{font-size:11px;color:#858d87;margin-top:6px}
.metric.green{color:#4f8064;background:linear-gradient(140deg,#edf5ef,#fff)}
.metric.orange{color:#b97942;background:linear-gradient(140deg,#fbf0e5,#fff)}
.metric.blue{color:#5d7fa9;background:linear-gradient(140deg,#edf2fa,#fff)}
.metric.red{color:#b65d62;background:linear-gradient(140deg,#faeded,#fff)}
.metric.purple{color:#866da4;background:linear-gradient(140deg,#f2edf8,#fff)}
.metric-value{color:inherit}
.panel{
  background:white;border-radius:15px;padding:19px;
  box-shadow:0 5px 22px #29382f08;margin-bottom:18px;
  min-width:0;
}
.panel h3{font-size:16px;margin:0 0 15px}
.panel-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap;
}
.chart-grid{
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
  gap:17px;
}
.chart-box{height:280px;position:relative;min-width:0}
.vendor-list{display:flex;flex-direction:column;gap:9px}
.vendor-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;text-align:left;width:100%;background:#faf9f6;
  padding:13px;border-radius:10px;color:var(--ink);
}
.vendor-row:hover{background:#f2eee8}
.vendor-name{font-weight:700;font-size:13px}
.vendor-detail{font-size:11px;color:var(--muted);margin-top:5px}
.vendor-amount{
  font-size:15px;font-weight:900;color:#bd6262;white-space:nowrap;
}
.vendor-empty{
  padding:24px;text-align:center;color:var(--muted);font-size:13px;
}
.progress{
  height:12px;background:#edf0eb;border-radius:20px;
  overflow:hidden;margin:14px 0;
}
.progress>div{
  height:100%;background:linear-gradient(90deg,#aab9ae,#637d70);
  transition:width .4s ease-in-out;
}
.summary-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
}
.summary-card{
  padding:14px;border-radius:11px;background:#f7f7f3;
  min-width:0;overflow-wrap:anywhere;
}
.summary-card b{display:block;font-size:19px;margin-top:6px}
.goal-progress-grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;margin:14px 0 4px
}
.goal-progress-item{
  min-width:0;padding:14px;border-radius:11px;
  background:#f7f7f3;overflow-wrap:anywhere
}
.goal-progress-label{font-size:12px;color:var(--muted);font-weight:700}
.goal-progress-value{font-size:20px;font-weight:900;margin-top:8px;color:var(--ink)}

.motivation-card{
  background:linear-gradient(135deg, #f3f7f4, #e8f0eb);
  border:1px solid #d2e0d7;border-radius:13px;padding:16px;
  margin-bottom:15px;
}
.motivation-title{font-size:15px;font-weight:800;color:#436151;margin-bottom:6px}
.motivation-text{font-size:14px;color:#2f4538;line-height:1.6;font-weight:700}

@media(max-width:900px){
  .goal-progress-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px){
  .goal-progress-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .goal-progress-item{padding:12px}
  .goal-progress-value{font-size:17px}
}
.red-text{color:#c43f43}
.green-text{color:#648875}
.orange-text{color:#c58a55}
.purple-text{color:#866da4}
.blue-text{color:#698db5}

/* 預估淨利報表 */
.profit-summary{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;margin-bottom:18px;
}
.profit-card{
  padding:18px;border-radius:13px;background:#f7f7f3;
  min-width:0;
}
.profit-card .label{font-size:12px;color:var(--muted)}
.profit-card .value{
  font-size:23px;font-weight:900;margin-top:9px;
  overflow-wrap:anywhere;
}
.profit-card.revenue .value{color:#648875}
.profit-card.expense .value{color:#c58a55}
.profit-card.net .value{color:#698db5}
.report-section-title{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:13px;
}
.report-section-title h3{margin:0}
.report-total{
  text-align:right;padding:15px;background:#f7f7f3;
  border-radius:10px;margin-top:12px;font-weight:800;
}
.report-total strong{font-size:20px}
.report-empty{
  text-align:center;padding:22px;color:var(--muted);
}

/* 表單及列表 */
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted);font-weight:bold}
input,select,textarea{
  width:100%;max-width:100%;min-width:0;
  border:1px solid var(--line);border-radius:8px;
  padding:10px;background:white;color:var(--ink);
}
textarea{min-height:75px;resize:vertical}
.toolbar{
  display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;
  align-items:center;
}
.toolbar input{flex:1;min-width:160px}
.toolbar select{width:auto;min-width:130px;max-width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}

/* 卡片式清單 */
.records-cards-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 14px;
  width: 100%;
}

.generic-card {
  background: white;
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 4px 18px rgba(41, 56, 47, 0.06);
  position: relative;
  overflow: hidden;
  border-left: 6px solid #648875;
  width: 100%;
}
.generic-card.border-red { border-left-color: #c36e70; }
.generic-card.border-orange { border-left-color: #c58a55; }
.generic-card.border-blue { border-left-color: #698db5; }
.generic-card.border-purple { border-left-color: #9278ad; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-title-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.card-date {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.card-main-title {
  font-size: 19px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: 0.5px;
}
.card-right-group {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.card-amount {
  font-size: 22px;
  font-weight: 900;
  color: #3b74a6;
}
.badge-status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge-green { background: #e8f5ec; color: #438755; }
.badge-red { background: #fde8e8; color: #b84242; }
.badge-orange { background: #fef3e6; color: #b26c2e; }
.badge-purple { background: #f2edf8; color: #755d91; }
.badge-gray { background: #f0f0ed; color: #606060; }

.card-body-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px 16px;
  font-size: 13.5px;
  color: #4a564f;
  margin: 12px 0;
  padding: 10px 0;
  border-top: 1px solid #f2f0eb;
  border-bottom: 1px solid #f2f0eb;
}
@media(max-width:900px){
  .card-body-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media(max-width:500px){
  .card-body-grid {
    grid-template-columns: 1fr;
  }
}

.card-item {
  display: flex;
  gap: 6px;
  overflow-wrap: anywhere;
}
.card-item span.label {
  color: var(--muted);
  white-space: nowrap;
}
.card-note {
  font-size: 12.5px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 12px;
}
.card-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
}
.card-actions button {
  padding: 8px 14px;
  font-size: 12.5px;
  font-weight: 700;
}
.btn-card-edit { background: #f0f4f2; color: #4b6a5b; }
.btn-card-toggle { background: #fcf0ee; color: #b84242; }
.btn-card-delete { background: #f7f7f4; color: #7a7a7a; }

.record-select-checkbox {
  width: 20px !important;
  height: 20px !important;
  cursor: pointer;
  accent-color: #648875;
}

/* 彈出式編輯視窗 (Modal) 樣式 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(35, 45, 40, 0.55);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn 0.2s ease-out;
}
.modal-content {
  background: white;
  width: 100%;
  max-width: 650px;
  max-height: 90vh;
  border-radius: 20px;
  padding: 24px;
  overflow-y: auto;
  box-shadow: 0 15px 50px rgba(0,0,0,0.18);
  animation: slideUp 0.25s ease-out;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.modal-header h3 { margin: 0; font-size: 18px; color: var(--ink); }
.modal-close-btn {
  background: #f0f0ed;
  color: var(--muted);
  border-radius: 50%;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; cursor: pointer; padding: 0;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* 傳統表格包裝 */
.table-wrap{
  width:100%;max-width:100%;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{
  padding:11px 9px;border-bottom:1px solid var(--line);
  text-align:left;font-size:13px;vertical-align:top;
}
th{background:#fafaf8;color:var(--muted);font-size:12px}
.mini{padding:6px 9px;font-size:11px}
.note{font-size:12px;color:var(--muted);line-height:1.8}
.check{display:flex;align-items:center;gap:8px}
.check input{width:18px;height:18px}
.empty{
  text-align:center;padding:25px;color:#929992;
}
.item-list{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
}
.item-row{
  display:grid;grid-template-columns:22px minmax(0,1fr) minmax(75px,110px);
  gap:8px;align-items:center;padding:9px;
  background:#faf9f6;border-radius:9px;min-width:0;
}
.item-row input[type=checkbox]{width:17px;height:17px}
.item-row input[type=number]{padding:7px}
.total-box{
  background:#f2f5f1;border-radius:10px;padding:14px;
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;font-weight:800;
}
.invoice-total{font-size:25px;color:#c43f43;font-weight:900}
.small-muted{font-size:11px;color:var(--muted)}
#toast{
  display:none;position:fixed;right:20px;bottom:20px;z-index:50;
  background:#35413b;color:white;padding:12px 18px;
  border-radius:10px;max-width:90vw;
}

@media(max-width:1024px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field.full{grid-column:1/-1}
  .item-list{grid-template-columns:1fr}
}

.print-header{display:none}
.print-footer{display:none}

@media print{
  @page {
    size: A4 portrait;
    margin: 10mm 12mm 10mm 12mm;
  }
  body{background:white!important;color:#000!important;font-size:9.5pt!important}
  .topbar, .sidebar, .no-print, #loginPage, #toast, .month-picker, .toolbar, .actions, form, .page-top, #editPanel, .modal-overlay, .panel-head button{
    display:none!important;
  }
  .layout{display:block!important;min-height:0!important;width:100%!important}
  .main{padding:0!important;margin:0!important;width:100%!important}
  
  #printableProfitReport, #invoicePrint, .panel{
    display:block!important;
    box-shadow:none!important;
    border:0!important;
    padding:0!important;
    margin:0 0 10px 0!important;
    background:white!important;
    page-break-inside: avoid;
    width: 100% !important;
  }
  
  .print-header{
    display:block!important;
    text-align:center;
    margin-bottom:10px;
    border-bottom:2px solid #222;
    padding-bottom:6px;
  }
  .print-header h1{font-size:16pt;font-weight:900;margin:0 0 2px;letter-spacing:2px}
  .print-header .print-subtitle{font-size:10pt;font-weight:bold;color:#333;margin-bottom:3px}
  .print-header .print-meta{font-size:9pt;color:#444;display:flex;justify-content:space-between;margin-top:4px}
  
  .summary-grid{
    display:flex!important;
    justify-content:space-between!important;
    gap:8px!important;
    margin-bottom:10px!important;
    width: 100% !important;
  }
  .summary-card{
    flex:1!important;
    border:1px solid #bbb!important;
    background:#fafafa!important;
    padding:6px 8px!important;
    border-radius:4px!important;
    text-align:center;
  }
  .summary-card b{font-size:13pt!important;margin-top:2px}

  .table-wrap{
    width: 100% !important;
    overflow: visible !important;
  }
  table{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    border-collapse:collapse!important;
    margin-top:4px!important;
    table-layout: fixed !important;
  }
  tr { page-break-inside: avoid; page-break-after: auto; }
  thead { display: table-header-group; }
  
  th, td{
    border:1px solid #444!important;
    padding:5px 6px!important;
    font-size:8.5pt!important;
    color:#000!important;
    background:transparent!important;
    overflow-wrap: anywhere !important;
    word-break: break-all !important;
  }
  th{
    background:#eef2ef!important;
    font-weight:bold!important;
    text-align:center!important;
  }
  
  .print-footer{
    display:flex!important;
    justify-content:space-between;
    margin-top:25px;
    padding-top:6px;
    border-top:1px solid #aaa;
    font-size:9.5pt;
    page-break-inside: avoid;
    width: 100% !important;
  }
  .print-sign-box{
    width:42%;
    text-align:center;
  }
  .print-sign-line{
    margin-top:20px;
    border-bottom:1px solid #000;
  }
}

@media(max-width:1150px){
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:900px){
  .layout{display:block}
  .sidebar{
    width:100%;display:flex;overflow-x:auto;
    white-space:nowrap;padding:7px;
    -webkit-overflow-scrolling:touch;
  }
  .nav-label{display:none}
  .nav{white-space:nowrap;width:auto;flex:0 0 auto;padding:10px}
  .main{padding:18px}
  .chart-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .topbar{padding:10px 12px;flex-wrap:wrap}
  .topbar .logo{font-size:15px}
  .user-area{gap:7px}
  .userbox{font-size:10px}
  .main{padding:12px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .metric{padding:13px}
  .metric-value{font-size:18px}
  .grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .item-list{grid-template-columns:1fr}
  .chart-box{height:245px}
  .summary-grid{grid-template-columns:1fr}
  .profit-summary{grid-template-columns:1fr}
  .profit-card .value{font-size:21px}
  .page-top{align-items:stretch}
  .back-dashboard{width:100%}
  .toolbar{display:grid;grid-template-columns:1fr}
  .toolbar input,.toolbar select{width:100%;min-width:0}
  .month-picker{width:100%;justify-content:space-between}
  .month-picker input{max-width:65%}
  .panel{padding:14px}
}
@media(max-width:360px){
  .metrics{grid-template-columns:1fr}
  .summary-grid{grid-template-columns:1fr}
  .item-row{grid-template-columns:20px minmax(0,1fr) 85px}
}
</style>
</head>

<body>

<!-- 登入畫面 -->
<section id="loginPage">
  <div class="login-card">
    <div class="logo">AS COATING</div>

  /* 預估淨利報表 */
  async function profitReport(){
    const data=await allData();
    const month=dashboardMonth;

    const workRows=data.work.filter(r=>isMonth(r,month)).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
    const expenseRows=data.expenses.filter(r=>isMonth(r,month)&&(r.paid===true||r.paid==="已完成付款"||r.paid==="已付")).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

    const revenueTotal=sum(workRows);
    const expenseTotal=sum(expenseRows, r => {
      const amt = Number(r.amount || 0);
      if (r.category === "水費") return amt * 0.5;
      if (r.category === "電費") return amt * 0.4;
      return amt;
    });
    const netTotal=revenueTotal-expenseTotal;

    const workHTML=workRows.map(r=>{
      const items=(r.items||[]).map(x=>{
        const name=x.name==="other_custom"||x.name==="other施工"?(x.customName||"Other施工"):x.name;
        return safe(name);
      }).join("、")||"—";

      return `
        <tr>
          <td>${safe(r.date||"")}</td>
          <td>${safe(r.plate||"")}</td>
          <td>${safe(r.owner||"")}</td>
          <td>${safe(r.vendorName||"—")}</td>
          <td>${items}</td>
          <td><b>${money(r.amount)}</b></td>
          <td>${safe(r.paymentStatus||"")}</td>
        </tr>
      `;
    }).join("");

    const expenseHTML=expenseRows.map(r=>{
      const amt = Number(r.amount || 0);
      let effAmt = amt;
      let noteExtra = "";
      if (r.category === "水費") {
        effAmt = amt * 0.5;
        noteExtra = ` (水費分攤50%)`;
      } else if (r.category === "電費") {
        effAmt = amt * 0.4;
        noteExtra = ` (電費分攤40%)`;
      }
      return `
      <tr>
        <td>${safe(r.date||"")}</td>
        <td>${getExpenseDisplayName(r)}</td>
        <td>${safe(r.item||"")}${safe(noteExtra)}</td>
        <td>${safe(r.payee||"—")}</td>
        <td>${safe(r.paymentMethod||"")}</td>
        <td><b>${money(effAmt)}</b></td>
      </tr>
    `;}).join("");

    $("pageContent").innerHTML=`
      <div id="printableProfitReport">
        <div class="print-header">
          <h1>AS COATING 營運管理系統</h1>
          <div class="print-subtitle">預估淨利報表 (Profit & Loss Statement)</div>
          <div class="print-meta">
            <span>統計月份：${safe(monthName(month))}</span>
            <span>列印日期：${today()}</span>
          </div>
        </div>

        <div class="page-top">
          <div>
            <h1 class="page-title">預估淨利報表</h1>
            <div class="page-desc">查看每月工作營收、已付款支出及預估淨利明細。</div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap" class="no-print">
            <div class="month-picker">
              <label for="profitMonth">報表月份</label>
              <input type="month" id="profitMonth" value="${safe(month)}">
            </div>
            ${backButton()}
          </div>
        </div>

        <div class="profit-summary">
          <div class="profit-card revenue">
            <div class="label">本月營收總額</div>
            <div class="value">${money(revenueTotal)}</div>
            <div class="note">${workRows.length} 筆工作紀錄</div>
          </div>
          <div class="profit-card expense">
            <div class="label">已付款支出總額</div>
            <div class="value">${money(expenseTotal)}</div>
            <div class="note">${expenseRows.length} 筆已付款支出（含分攤計算）</div>
          </div>
          <div class="profit-card net">
            <div class="label">預估淨利</div>
            <div class="value">${money(netTotal)}</div>
            <div class="note">營收總額－已付款支出總額</div>
          </div>
        </div>

        <div class="panel">
          <div class="report-section-title">
            <h3>一、工作營收明細</h3>
            <span class="note">${monthName(month)}｜${workRows.length} 筆</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>施工日期</th><th>車牌</th><th>車主</th><th>廠商／客戶</th>

              </tbody>

      <div class="actions no-print" style="margin-top:20px;">
        <button class="primary" id="printProfitReport">🖨️ 列印正式報表／另存 PDF</button>
        <button class="back-dashboard" id="backDashboardBottom">返回營運總覽</button>
      </div>
    `;

    bindBack();
    $("profitMonth").onchange=e=>{
      dashboardMonth=e.target.value||month;
      profitReport();
    };
    $("backDashboardBottom").onclick=()=>loadPage("dashboard");
    $("printProfitReport").onclick=()=>window.print();

  /* 表單與欄位產生器 */
  function recordFormHTML(m, r={}){

      const selected=Array.isArray(r.items)?r.items:[];
      const other=selected.find(x=>x.name==="other_custom"||x.name==="other施工");

              ${WORK_OWNERS.map(o=>`<option value="${safe(o)}" ${ownerSelectVal===o?"selected":""}>${safe(o)}</option>`)}

              <option value="">（無／自由空白）</option>
              ${WORK_VENDORS.map(v=>`<option value="${safe(v)}" ${selectVal===v?"selected":""}>${safe(v)}</option>`)}
              <option value="CUSTOM_INPUT" ${selectVal==="CUSTOM_INPUT"?"selected":""}>✏️ 其他／手動自由輸入...</option>
            </select>
            <input name="vendorName" id="workVendorInput" value="${safe(val)}" placeholder="請輸入廠商或客戶名稱" class="${selectVal==="CUSTOM_INPUT"?"":"hidden"}">
          </div>

            <label>施工項目（可複選，各項目可輸入金額）</label>

            <input name="otherWorkName" id="otherWorkName" value="${safe(other?.customName||"")}" placeholder="請輸入實際施工項目">
          </div>
          <div class="field full">
            <div class="total-box">
              <span>施工項目合計</span>
              <strong id="workItemTotal">${money(sum(selected,x=>x.price))}</strong>

      if(f.type==="select"){
        control=`
          <select name="${f.key}" ${f.key==="status"?'id="advanceStatusSelect"':""}>

                isSelected = (v === x);
              }
              return `<option value="${safe(x)}" ${isSelected ? "selected" : ""}>${safe(x)}</option>`;
            }).join("")}
          </select>
        `;
      }else if(f.type==="vendor_dual"){
        const isPreset = DEFAULT_VENDORS.includes(v);
        const selectVal = v === "" ? "" : (isPreset ? v : "CUSTOM_INPUT");
        control=`
          <select class="vendor-dual-select" data-target="${f.key}" style="margin-bottom:6px">
            <option value="">（無／自由空白）</option>
            ${DEFAULT_VENDORS.map(opt=>`<option value="${safe(opt)}" ${selectVal===opt?"selected":""}>${safe(opt)}</option>`)}
            <option value="CUSTOM_INPUT" ${selectVal==="CUSTOM_INPUT"?"selected":""}>✏️ 其他／手動自由輸入...</option>
          </select>
          <input name="${f.key}" id="${f.key}Input" value="${safe(v)}" placeholder="自由輸入名稱" class="${selectVal==="CUSTOM_INPUT"?"":"hidden"}">
        `;
      }else if(f.type==="textarea"){
        control=`<textarea name="${f.key}">${safe(v)}</textarea>`;
      }else if(f.type==="checkbox"){
        control=`
          <label class="check">
            <input type="checkbox" name="${f.key}" ${v===true||v==="已完成付款"?"checked":""}>
            已完成付款
          </label>
        `;
      }else{
        control=`
          <input name="${f.key}" ${f.key==="statusDate"?'id="advanceStatusDateInput"':""} type="${f.type||"text"}" value="${safe(v || (f.type==="month"&&page==="goals"?new Date().toISOString().slice(0,7):""))}" ${f.required?"required":""} ${f.type==="number"?'min="0" step="1"':""}>
        `;
      }
      if(f.type==="checkbox")return `<div class="field">${control}</div>`;
      
      let wrapperClass = f.full?"full":"";
      if(f.key === "statusDate"){
        const currentStatus = r.status || "待收回";
        if(currentStatus !== "已收回" && currentStatus !== "已抵扣"){
          wrapperClass += " hidden";
        }
        wrapperClass += " advance-date-field-wrapper";
      }

      return `
        <div class="field ${wrapperClass}">
          <label>${f.label}${f.required?" *":""}</label>
          ${control}
        </div>
      `;
    }).join("");
  }

  function bindFormBehaviors(m){
    if(m==="work"){
      const checks=[...document.querySelectorAll(".work-item-check")];
      const prices=[...document.querySelectorAll(".work-item-price")];
      const update=()=>{
        let total=0;
        let otherChecked=false;
        checks.forEach(c=>{
          const p=document.querySelector(`[data-price="${CSS.escape(c.dataset.item)}"]`);
          if(c.checked)total+=Number(p?.value||0);
          if(c.dataset.item==="other施工")otherChecked=c.checked;
        });
        const otherField=$("otherWorkField");
        if(otherField)otherField.classList.toggle("hidden",!otherChecked);
        const totalBox=$("workItemTotal");
        if(totalBox)totalBox.textContent=money(total);
        const amountInput=$("recordForm")?.elements.amount;
        if(amountInput && !amountInput.dataset.userEdited){
          amountInput.value=total;
        }
      };

      checks.forEach(c=>c.onchange=update);
      prices.forEach(p=>{
        p.oninput=()=>{
          const check=checks.find(c=>c.dataset.item===p.dataset.price);
          if(check && p.value.trim()!=="")check.checked=true;
          update();
        };
      });

      const amountInput = $("recordForm")?.elements.amount;
      if(amountInput){
        amountInput.oninput = () => { amountInput.dataset.userEdited = "1"; };
      }

      const vSelect = $("workVendorSelect");
      const vInput = $("workVendorInput");
      if(vSelect && vInput){
        vSelect.onchange = () => {
          if(vSelect.value === "CUSTOM_INPUT"){
            vInput.classList.remove("hidden");
            vInput.focus();
          } else {
            vInput.classList.add("hidden");
            vInput.value = vSelect.value;
          }
        };
      }
      const oSelect = $("workOwnerSelect");
      const oInput = $("workOwnerInput");
      if(oSelect && oInput){
        oSelect.onchange = () => {
          if(oSelect.value === "CUSTOM_INPUT"){
            oInput.classList.remove("hidden");
            oInput.focus();
          } else {
            oInput.classList.add("hidden");
            oInput.value = oSelect.value;
          }
        };
      }
      const pmSel = $("workPaymentMethodSelect");
      const tfFields = $("workTransferFields");
      if(pmSel && tfFields){
        pmSel.onchange = () => {
          if(pmSel.value === "匯款"){
            tfFields.classList.remove("hidden");
          } else {
            tfFields.classList.add("hidden");
          }
        };
      }
    }else{
      document.querySelectorAll(".vendor-dual-select").forEach(sel=>{
        const targetId = sel.dataset.target + "Input";
        const inp = $(targetId);
        if(!inp)return;
        sel.onchange = () => {
          if(sel.value === "CUSTOM_INPUT"){
            inp.classList.remove("hidden");
            inp.focus();
          } else {
            inp.classList.add("hidden");
            inp.value = sel.value;
          }
        };
      });

      if(m==="advances"){
        const statusSel = $("advanceStatusSelect");
        const dateFieldWrapper = document.querySelector(".advance-date-field-wrapper");
        if(statusSel && dateFieldWrapper){
          statusSel.onchange = () => {
            if(statusSel.value === "已收回" || statusSel.value === "已抵扣"){
              dateFieldWrapper.classList.remove("hidden");
            } else {
              dateFieldWrapper.classList.add("hidden");
              const dateInput = $("advanceStatusDateInput");
              if(dateInput) dateInput.value = "";
            }
          };
        }
      }

      if(m==="expenses"){
        const form=$("recordForm");
        const category=form?.elements.category;
        const item=form?.elements.namedItem("item");
        const applyExpenseItem=()=>{
          if(!category||!item)return;
          if(category.value && category.value !== "other" && category.value !== "其他"){
            if(!item.value.trim() || EXPENSE_CATEGORIES.includes(item.value)){
              item.value = category.value;
            }
          }
        };
        category?.addEventListener("change",applyExpenseItem);
      }

      if(m==="landlord"){
        const form=$("recordForm");
        const category=form?.elements.category;
        const share=form?.elements.share;
        const item=form?.elements.namedItem("item");
        if(category){
          category.onchange=()=>{
            if(category.value==="水費" && share) share.value=50;
            else if(category.value==="電費" && share) share.value=40;
            else if(share && !share.dataset.userChanged) share.value="";
            if(item && (!item.dataset || !item.dataset.customInput)){
              item.value = category.value || "";
            }
          };
        }
        if(share) share.oninput=()=>share.dataset.userChanged="1";
        if(item) item.oninput=()=>item.dataset.customInput = item.value.trim() !== "" ? "1" : "";
      }
    }
  }

  function openModal(m, recordId=null){
    const isEdit = Boolean(recordId);
    const current = isEdit ? records.find(r=>r.id===recordId)||{} : {};
    const cfg = MODULES[m];

    $("modalContainer").innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
          <div class="modal-header">
            <h3>${isEdit?"修改":"新增"}${cfg.title}</h3>
            <button class="modal-close-btn" id="modalCloseBtn">✕</button>
          </div>
          <form id="recordForm" data-record-id="${safe(recordId||"")}">
            ${recordFormHTML(m, current)}
            <div class="actions" style="margin-top:20px; justify-content:flex-end;">
              <button class="secondary" type="button" id="modalCancelBtn">取消</button>
              <button class="primary" type="submit">儲存資料</button>
            </div>
          </form>
        </div>
      </div>
    `;

    bindFormBehaviors(m);

    $("modalCloseBtn").onclick = closeModal;
    $("modalCancelBtn").onclick = closeModal;
    $("modalOverlay").onclick = e => {
      if(e.target === $("modalOverlay")) closeModal();
    };

    $("recordForm").onsubmit = async e => {
      e.preventDefault();
      await saveRecord(m, recordId, e.target);
    };
  }

  function closeModal(){
    $("modalContainer").innerHTML = "";
  }

  function searchWords(text,query){
    const words=String(query||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
    const haystack=String(text||"").toLowerCase();
    return words.every(word=>haystack.includes(word));
  }

  function searchableText(r){
    const itemText=(r.items||[]).map(x=>
      x.name==="other_custom"||x.name==="other施工"?(x.customName||"other施工"):x.name
    ).join(" ");

    return [
      r.date,r.month,r.plate,r.owner,r.car,r.vendorName,
      r.paymentStatus,r.paymentMethod,r.transferLast5,r.transferDate,r.note,
      r.category,r.item,r.advanceItem,r.payee,r.person,r.status,r.statusDate,
      r.direction,r.type,itemText
    ].filter(Boolean).join(" ");
  }

  function moduleList(m){
    let list=[...records];
    list=list.filter(r=>{
      const dateVal = r.date || r.month || "";
      return String(dateVal).slice(0,7) === dashboardMonth;
    });

    if(m==="work"){
      if(vendorFilter){
        list=list.filter(r=>(r.vendorName||"")===vendorFilter);
      }
      if(paymentFilter==="未收及月結"){
        list=list.filter(r=>["未收","月結"].includes(r.paymentStatus));
      }else if(paymentFilter==="已收"){
        list=list.filter(r=>r.paymentStatus==="已收");
      }else if(paymentFilter==="未收"){
        list=list.filter(r=>r.paymentStatus==="未收");
      }else if(paymentFilter==="月結"){
        list=list.filter(r=>r.paymentStatus==="月結");
      }
    }
    return list.sort((a,b)=>String(b.date||b.month||"").localeCompare(String(a.date||a.month||"")));
  }

  function applyDOMFilter(){
    const query = $("searchInput") ? $("searchInput") .value : "";
    const cards = document.querySelectorAll(".generic-card");
    cards.forEach(card => {
      const text = card.dataset.search || "";
      if(searchWords(text, query)){
        card.classList.remove("hidden");
      } else {
        card.classList.add("hidden");
      }
    });
  }

    $("pageContent").innerHTML=`
      <div class="page-top">

          const defaultDate = `${dashboardMonth}-01`;
          for(const exp of FIXED_MONTHLY_EXPENSES){

              date: defaultDate,

              amount: exp.amount,

              paid: "未付款",

  function landlordEffectiveAmount(r){
    const amountValue = Number(r.amount || 0);
    const category = r.category;
    let share = r.share;
    if(category === "水費" || category === "電費"){
      if(share === undefined || share === null || share === "" || isNaN(Number(share))){
        share = category === "水費" ? 50 : 40;
      }
      return amountValue * (Number(share) / 100);
    }
    return amountValue;
  }

  async function upsertLinkedLandlord(linkId,data){
    let list=await read("landlord");
    const old=list.find(x=>x.id===linkId||x.linkedRecordId===data.linkedRecordId);
    const payload={...data,sourceType:data.sourceType||"expense",linkedRecordId:data.linkedRecordId||linkId};
    if(guest()){
      if(old)list=list.map(x=>x.id===linkId||x.linkedRecordId===data.linkedRecordId?{...x,...payload}:x);
      else list.push({id:linkId,...payload});
      guestWrite("landlord",list);
      return;
    }
    if(old)await updateDoc(doc(col("landlord"),old.id),{...payload,updatedAt:serverTimestamp()});
    else await addDoc(col("landlord"),{...payload,createdAt:serverTimestamp()});
  }

  async function syncExpenseToLandlord(expenseData,expenseId){
    const payee=expenseData.payee;
    const category=expenseData.category;
    const linkId=expenseData.landlordLinkId||("expense_link_"+expenseId);
    if(category!=="水費"&&category!=="電費"&&category!=="房屋租金"&&category!=="停車位費用"&&category!=="大樓管理費"&&category!=="勞健保費"&&!isASPerson(payee))return null;
    const share=category==="水費"?50:category==="電費"?40:100;
    const payload={
      date:expenseData.date,direction:"AS COATING 應付 AS-奧迪",category:category,
      item:expenseData.item||category,amount:Number(expenseData.amount||0),share,
      note:"由支出記帳自動同步｜"+(expenseData.note||""),sourceType:"expense",linkedRecordId:expenseId
    };
    await upsertLinkedLandlord(linkId,payload);
    return linkId;
  }

  async function syncWorkToLandlord(workData,workId){
    const isAS=isASPerson(workData.vendorName);
    const linkId=workData.landlordLinkId||("work_link_"+workId);
    if(!isAS)return null;
    const itemText=(workData.items||[]).map(x=>x.name==="other_custom"||x.name==="other施工"?(x.customName||x.name):x.name).join("、");
    await upsertLinkedLandlord(linkId,{
      date:workData.date,direction:"AS-奧迪應付 AS COATING",category:"AS-奧迪委託施工",
      item:(workData.plate?workData.plate+"｜":"")+(itemText||"施工服務"),
      amount:Number(workData.amount||0),share:100,
      note:"由工作紀錄自動同步｜"+(workData.note||""),sourceType:"work",linkedRecordId:workId
    });
    return linkId;
  }

  async function syncAdvanceToLandlord(advanceData,advanceId){
    const isAS=isASPerson(advanceData.person);
    const linkId=advanceData.landlordLinkId||("advance_link_"+advanceId);
    if(!isAS)return null;
    const advItemText = advanceData.item || advanceData.advanceItem || "代墊項目";
    await upsertLinkedLandlord(linkId,{
      date:advanceData.date,direction:"AS-奧迪應付 AS COATING",category:"other",
      item:"【代墊請款】"+advItemText,amount:Number(advanceData.amount||0),share:100,
      note:"幫奧迪代墊付款，向奧迪請款｜"+(advanceData.note||""),sourceType:"advance",linkedRecordId:advanceId
    });
    return linkId;
  }

  async function upsertLinkedTarget(colName, linkId, payload){
    let list = guest() ? guestRead(colName) : await read(colName);
    let old = list.find(x => x.id === linkId || x.landlordLinkId === linkId || x.linkedRecordId === linkId);
    if(guest()){
      if(old) list = list.map(x => (x.id === old.id || x.landlordLinkId === linkId || x.linkedRecordId === linkId ? {...x, ...payload} : x));
      else list.push({id: linkId, landlordLinkId: linkId, linkedRecordId: linkId, ...payload});
      guestWrite(colName, list);
      return old?.id || linkId;
    } else {
      if(old){await updateDoc(doc(col(colName), old.id), {...payload, updatedAt: serverTimestamp()});return old.id;}
      const ref=await addDoc(col(colName), {landlordLinkId: linkId, linkedRecordId: linkId, ...payload, createdAt: serverTimestamp()});
      return ref.id;
    }
  }

  async function syncLandlordToExpenseOrAdvance(landlordData, landlordId){
    const itemText = landlordData.item || landlordData.category || "";
    const sourceType = landlordData.sourceType || "";
    const sourceId = landlordData.linkedRecordId || "";
    const finalAmount = Number(landlordData.amount || 0);
    const cleanNote = String(landlordData.note || "")
      .replace(/^由 AS-奧迪往來結算同步｜/, "")
      .replace(/^由支出記帳自動同步｜/, "")
      .replace(/^由工作紀錄自動同步｜/, "")
      .replace(/^幫奧迪代墊付款，向奧迪請款｜/, "");

    // 工作紀錄：AS-奧迪委託施工的結算調整，回寫原工作紀錄。
    if(sourceType === "work" || landlordData.category === "AS-奧迪委託施工"){
      const workList = guest() ? guestRead("work") : await read("work");
      const target = workList.find(x => x.id === sourceId);
      if(target){
        const updated = {...target, date:landlordData.date, amount:finalAmount, note:cleanNote};
        if(guest()) guestWrite("work", workList.map(x=>x.id===target.id?updated:x));
        else await updateDoc(doc(col("work"),target.id),{date:updated.date,amount:updated.amount,note:updated.note,updatedAt:serverTimestamp()});
      } else if(!sourceId){
        const newWork={date:landlordData.date,plate:"",owner:"",car:"",carColor:"",vendorName:"AS",items:[],amount:finalAmount,paymentStatus:"未收",paymentMethod:"月結",note:cleanNote};
        await upsertLinkedTarget("work",landlordId,{...newWork,landlordLinkId:landlordId,linkedRecordId:landlordId});
        const createdList=guest()?guestRead("work"):await read("work");
        const created=createdList.find(x=>x.id===landlordId||x.linkedRecordId===landlordId||x.landlordLinkId===landlordId);
        if(created){
          if(guest())guestWrite("landlord",guestRead("landlord").map(x=>x.id===landlordId?{...x,sourceType:"work",linkedRecordId:created.id}:x));
          else await updateDoc(doc(col("landlord"),landlordId),{sourceType:"work",linkedRecordId:created.id,updatedAt:serverTimestamp()});
        }
      }
      return;
    }

    // 代墊管理：只有代墊項目才建立／更新代墊，不把所有「AS 應付」誤判為代墊。
    const isAdvance = sourceType === "advance" || itemText.includes("代墊") || cleanNote.includes("代墊");
    if(isAdvance){
      const advances = guest() ? guestRead("advances") : await read("advances");
      const target = sourceId ? advances.find(x=>x.id===sourceId) : advances.find(x=>x.landlordLinkId===landlordId || x.linkedRecordId===landlordId);
      const payload={date:landlordData.date,item:itemText.replace("【代墊請款】",""),advanceItem:itemText.replace("【代墊請款】",""),amount:finalAmount,person:"AS-奧迪",status:target?.status||"待收回",statusDate:target?.statusDate||"",note:cleanNote,landlordLinkId:landlordId,linkedRecordId:landlordId};
      if(target){
        if(guest()) guestWrite("advances",advances.map(x=>x.id===target.id?{...target,...payload}:x));
        else await updateDoc(doc(col("advances"),target.id),{...payload,updatedAt:serverTimestamp()});
      } else {
        const createdId=await upsertLinkedTarget("advances",landlordId,payload);
        if(guest())guestWrite("landlord",guestRead("landlord").map(x=>x.id===landlordId?{...x,sourceType:"advance",linkedRecordId:createdId}:x));
        else await updateDoc(doc(col("landlord"),landlordId),{sourceType:"advance",linkedRecordId:createdId,updatedAt:serverTimestamp()});
      }
      await cleanUnmatchedTarget("expenses",landlordId);
      return;
    }

    // 支出記帳：租金、管理費、勞健保、水電等項目回寫支出資料。
    const expenses = guest() ? guestRead("expenses") : await read("expenses");
    const target = sourceId ? expenses.find(x=>x.id===sourceId) : expenses.find(x=>x.landlordLinkId===landlordId || x.linkedRecordId===landlordId);
    const category = landlordData.category || "other";
    const payload={date:landlordData.date,category,item:itemText,amount:finalAmount,payee:"AS-奧迪",paymentMethod:target?.paymentMethod||"現金",paid:target?.paid||"未付款",paidDate:target?.paidDate||"",note:cleanNote,landlordLinkId:landlordId,linkedRecordId:landlordId};
    if(target){
      if(guest()) guestWrite("expenses",expenses.map(x=>x.id===target.id?{...target,...payload}:x));
      else await updateDoc(doc(col("expenses"),target.id),{...payload,updatedAt:serverTimestamp()});
    } else {
      const createdId=await upsertLinkedTarget("expenses",landlordId,payload);
      if(guest())guestWrite("landlord",guestRead("landlord").map(x=>x.id===landlordId?{...x,sourceType:"expense",linkedRecordId:createdId}:x));
      else await updateDoc(doc(col("landlord"),landlordId),{sourceType:"expense",linkedRecordId:createdId,updatedAt:serverTimestamp()});
    }
    await cleanUnmatchedTarget("advances",landlordId);
  }

  async function cleanUnmatchedTarget(colName, landlordId){
    let list = guest() ? guestRead(colName) : await read(colName);
    const old = list.filter(x => x.landlordLinkId === landlordId || x.linkedRecordId === landlordId || x.id === landlordId);
    if(old.length > 0){
      if(guest()){
        list = list.filter(x => !(x.landlordLinkId === landlordId || x.linkedRecordId === landlordId || x.id === landlordId));
        guestWrite(colName, list);
      } else {
        await Promise.all(old.map(r => deleteDoc(doc(col(colName), r.id))));
      }
    }
  }

  async function generateLandlordStatement(){
    const month = dashboardMonth;
    const list = records.filter(r => isMonth(r, month));

    const workRecords = guest() ? guestRead("work") : await read("work");
    const advanceRecords = guest() ? guestRead("advances") : await read("advances");

    const deductionItems = list.filter(r => r.direction === "AS COATING 應付 AS-奧迪");
    const workItems = list.filter(r => r.sourceType === "work" || r.category === "AS-奧迪委託施工" || (r.id && String(r.id).startsWith("work_link_")));
    const advanceItems = list.filter(r => (r.sourceType === "advance" || (r.note||"").includes("代墊")) && !workItems.includes(r));

    const calcSubtotal = (arr) => sum(arr, r => landlordEffectiveAmount(r));

    const renderTable = (title, items, type) => `
      <div style="margin-bottom:20px;">
        <h4 style="margin:0 0 8px; color:#526b5c; border-bottom:2px solid #e8e6df; padding-bottom:4px;">${title}（共 ${items.length} 筆）</h4>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                ${type === "work" ? `
                  <th>施工日期</th><th>車牌</th><th>車主</th><th>車款</th><th>車色</th><th>施工項目</th><th>金額</th><th>收款狀態</th>
                ` : type === "advance" ? `
                  <th>代墊日期</th><th>代墊項目</th><th>代墊金額</th><th>代墊對象</th><th>處理狀態</th><th>處理日期</th><th>備註說明</th>
                ` : `
                  <th>日期</th><th>項目類別</th><th>項目說明</th><th>原始金額</th><th>分擔比例</th><th>應負擔金額</th>
                `}
              </tr>
            </thead>
            <tbody>
              ${items.map(r => {
                if(type === "work"){
                  let workRec = null;
                  if(r.linkedRecordId){
                    workRec = workRecords.find(x => x.id === r.linkedRecordId);
                  }
                  if(!workRec && r.id){
                    const cleanWorkId = r.id.replace("work_link_", "");
                    workRec = workRecords.find(x => x.id === cleanWorkId);
                  }
                  if(!workRec){
                    workRec = workRecords.find(x => x.date === r.date && Number(x.amount||0) === Number(r.amount||0));
                  }

                  const plate = workRec?.plate || "—";
                  const owner = workRec?.owner || "—";
                  const car = workRec?.car || "—";
                  const carColor = workRec?.carColor || "—";
                  const paymentStatus = workRec?.paymentStatus || "—";
                  const amt = Number(workRec?.amount ?? r.amount ?? 0);

                  let itemStr = "";
                  if(workRec && Array.isArray(workRec.items) && workRec.items.length > 0){
                    itemStr = workRec.items.map(x => (x.name === "other_custom" || x.name === "other施工") ? (x.customName || "other施工") : x.name).join("、");
                  } else {
                    itemStr = r.item || "施工服務";
                  }

                  return `
                    <tr>
                      <td>${safe(r.date)}</td>
                      <td><b>${safe(plate)}</b></td>
                      <td>${safe(owner)}</td>
                      <td>${safe(car)}</td>
                      <td>${safe(carColor)}</td>
                      <td>${safe(itemStr)}</td>
                      <td><b>${money(amt)}</b></td>
                      <td>${safe(paymentStatus)}</td>
                    </tr>
                  `;
                } else if(type === "advance"){
                  let advRec = null;
                  if(r.linkedRecordId){
                    advRec = advanceRecords.find(x => x.id === r.linkedRecordId);
                  }
                  if(!advRec && r.id){
                    const cleanAdvId = r.id.replace("advance_link_", "");
                    advRec = advanceRecords.find(x => x.id === cleanAdvId);
                  }
                  if(!advRec){
                    advRec = advanceRecords.find(x => x.date === r.date && Number(x.amount||0) === Number(r.amount||0));
                  }

                  const advItem = advRec?.item || advRec?.advanceItem || r.item || "—";
                  const advPerson = advRec?.person || "AS-奧迪";
                  const advStatus = advRec?.status || "待收回";
                  const advStatusDate = advRec?.statusDate || "—";
                  const advAmt = Number(advRec?.amount ?? r.amount ?? 0);
                  const advNote = advRec?.note || r.note || "";

                  return `
                    <tr>
                      <td>${safe(r.date)}</td>
                      <td><b>${safe(advItem)}</b></td>
                      <td><b>${money(advAmt)}</b></td>
                      <td>${safe(advPerson)}</td>
                      <td>${safe(advStatus)}</td>
                      <td>${safe(advStatusDate)}</td>
                      <td>${safe(advNote)}</td>
                    </tr>
                  `;
                } else {
                  const rawAmt = Number(r.amount || 0);
                  let share = r.share || (r.category==="水費"?50:r.category==="電費"?40:100);
                  return `
                    <tr>
                      <td>${safe(r.date)}</td>
                      <td>${safe(r.category)}</td>
                      <td>${safe(r.item)}</td>
                      <td>${money(rawAmt)}</td>
                      <td>${r.category==="水費"||r.category==="電費"?share+"%":"—"}</td>
                      <td><b>${money(landlordEffectiveAmount(r))}</b></td>
                    </tr>
                  `;
                }
              }).join("") || `<tr><td colspan="8" class="empty">此區塊無相關紀錄</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="text-align:right; margin-top:6px; font-weight:bold;">
          ${title}小計：<span class="green-text">${money(calcSubtotal(items))}</span>
        </div>
      </div>
    `;

    const container = $("statementResultContainer");
    if(!container) return;

    container.innerHTML = `
      <div class="panel" style="background:#fff; border:2px dashed #71877b;">
        <div class="print-header">
          <h1>AS COATING ＆ 奧迪</h1>
          <div class="print-subtitle">往來對帳結算明細表 (Statement of Accounts)</div>
          <div class="print-meta">
            <span>結算月份：${safe(monthName(month))}</span>
            <span>列印日期：${today()}</span>
          </div>
        </div>

        <div class="panel-head">
          <h3>AS COATING ＆ 奧迪 — ${safe(monthName(month))} 往來對帳結算明細</h3>
          <button class="secondary mini no-print" id="printStatementBtn">🖨️ 列印正式對帳單／另存 PDF</button>
        </div>
        ${renderTable("一、應付款項", deductionItems, "deduction")}
        ${renderTable("二、AS 工作紀錄項目", workItems, "work")}
        ${renderTable("三、代墊項目", advanceItems, "advance")}

        <div class="print-footer">
          <div class="print-sign-box">AS COATING 簽章：<div class="print-sign-line"></div></div>
          <div class="print-sign-box">奧迪代表簽章：<div class="print-sign-line"></div></div>
        </div>
      </div>
    `;

    const pb = $("printStatementBtn");
    if(pb)pb.onclick = () => window.print();
    container.scrollIntoView({behavior:"smooth", block:"start"});
  }

  async function saveRecord(m, recordId, form){
    const submitButton=form.querySelector('button[type="submit"]');
    if(submitButton?.disabled)return;
    if(submitButton){submitButton.disabled=true;submitButton.textContent="儲存中…";}
    try{
      let data={};
      if(m==="work"){
        const selected=[];
        document.querySelectorAll(".work-item-check:checked").forEach(c=>{
          const p=document.querySelector(`[data-price="${CSS.escape(c.dataset.item)}"]`);
          const item={name:c.dataset.item==="other_custom"||c.dataset.item==="other施工"?"other_custom":c.dataset.item,price:Number(p?.value||0)};
          if(c.dataset.item==="其他施工") item.customName=form.querySelector('[name="otherWorkName"]')?.value.trim()||"";
          selected.push(item);
        });
        const field=k=>form.elements.namedItem(k);
        const vSelect=form.querySelector("#workVendorSelect"),vInput=form.querySelector("#workVendorInput");
        const oSelect=form.querySelector("#workOwnerSelect"),oInput=form.querySelector("#workOwnerInput");
        data={date:field("date")?.value||"",plate:field("plate")?.value.trim()||"",owner:oSelect?.value==="CUSTOM_INPUT"?(oInput?.value.trim()||""):(oSelect?.value||oInput?.value.trim()||""),car:field("car")?.value.trim()||"",carColor:field("carColor")?.value.trim()||"",vendorName:vSelect?.value==="CUSTOM_INPUT"?(vInput?.value.trim()||""):(vSelect?.value||vInput?.value.trim()||""),items:selected,amount:Number(field("amount")?.value||0),paymentStatus:field("paymentStatus")?.value||"未收",paymentMethod:field("paymentMethod")?.value||"現金",transferLast5:field("paymentMethod")?.value==="匯款"?(field("transferLast5")?.value.trim()||""):"",transferDate:field("paymentMethod")?.value==="匯款"?(field("transferDate")?.value||""):"",note:field("note")?.value.trim()||""};
        if(!data.date||!data.plate){toast("請填寫施工日期及車牌。");return;}
        if(data.amount<0){toast("施工總金額不可為負數。");return;}
      }else{
        const fields=FIELDS[m];
        if(!fields)throw new Error("找不到此模組的欄位設定："+m);
        for(const f of fields){
          const el=form.elements.namedItem(f.key);
          if(f.type==="vendor_dual"){
            const dualSel=form.querySelector(`.vendor-dual-select[data-target="${f.key}"]`);
            const dualInp=form.querySelector(`#${f.key}Input`);
            data[f.key]=dualSel?.value==="CUSTOM_INPUT"?(dualInp?.value.trim()||""):(dualSel?.value||el?.value?.trim?.()||"");
          }else if(el){
            data[f.key]=f.type==="checkbox"?el.checked:f.type==="number"?Number(el.value||0):(el.value??"").toString().trim();
          }
        }
        if(m==="expenses"){
          const itemInput=form.querySelector('[name="item"]');
          if(itemInput)data.item=itemInput.value.trim();
          if(!data.item&&data.category)data.item=data.category;
          if(!data.paid)data.paid="未付款";
        }
        if(m==="advances"){
          const itemEl=form.querySelector('[name="item"]');
          if(itemEl)data.item=itemEl.value.trim();
          if(data.status!=="已收回"&&data.status!=="已抵扣")data.statusDate="";
        }
      }

      if((m==="expenses"&&isASPerson(data.payee))||(m==="advances"&&isASPerson(data.person))){
        if(m==="expenses")data.payee="AS-奧迪";
        if(m==="advances")data.person="AS-奧迪";
      }
      if(m==="landlord"){
        if(data.category==="水費"&&(data.share===0||data.share===""))data.share=50;
        if(data.category==="電費"&&(data.share===0||data.share===""))data.share=40;
      }

      let savedId=recordId;
      const existingList=guest()?guestRead(m):await read(m);
      const existing=recordId?existingList.find(r=>r.id===recordId):null;
      if(existing?.landlordLinkId)data.landlordLinkId=existing.landlordLinkId;
      if(guest()){
        let list=existingList;
        if(recordId)list=list.map(r=>r.id===recordId?{...r,...data}:r);
        else{savedId="guest_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);list.push({id:savedId,...data});}
        guestWrite(m,list);
      }else{
        if(recordId)await updateDoc(doc(col(m),recordId),{...data,updatedAt:serverTimestamp()});
        else{const ref=await addDoc(col(m),{...data,createdAt:serverTimestamp()});savedId=ref.id;}
      }

      if(m==="work"){
        if(isASPerson(data.vendorName)){
          const linked=await syncWorkToLandlord(data,savedId);
          if(linked){if(guest())guestWrite("work",guestRead("work").map(r=>r.id===savedId?{...r,landlordLinkId:linked}:r));else await updateDoc(doc(col("work"),savedId),{landlordLinkId:linked});}
        }else{
          const ll=guest()?guestRead("landlord"):await read("landlord");
          const linked=ll.filter(x=>x.sourceType==="work"&&x.linkedRecordId===savedId);
          if(guest())guestWrite("landlord",ll.filter(x=>!linked.some(y=>y.id===x.id)));
          else await Promise.all(linked.map(x=>deleteDoc(doc(col("landlord"),x.id))));
        }
      }
      if(m==="expenses"){
        const linked=await syncExpenseToLandlord(data,savedId);
        if(linked){if(guest())guestWrite("expenses",guestRead("expenses").map(r=>r.id===savedId?{...r,landlordLinkId:linked}:r));else await updateDoc(doc(col("expenses"),savedId),{landlordLinkId:linked});}
        else if(existing?.landlordLinkId){
          const ll=guest()?guestRead("landlord"):await read("landlord");
          const matches=ll.filter(x=>x.linkedRecordId===savedId||x.id===existing.landlordLinkId);
          if(guest())guestWrite("landlord",ll.filter(x=>!matches.some(y=>y.id===x.id)));
          else await Promise.all(matches.map(x=>deleteDoc(doc(col("landlord"),x.id))));
        }
      }
      if(m==="advances"){
        const linked=await syncAdvanceToLandlord(data,savedId);
        if(linked){if(guest())guestWrite("advances",guestRead("advances").map(r=>r.id===savedId?{...r,landlordLinkId:linked}:r));else await updateDoc(doc(col("advances"),savedId),{landlordLinkId:linked});}
        else if(existing?.landlordLinkId){
          const ll=guest()?guestRead("landlord"):await read("landlord");
          const matches=ll.filter(x=>x.linkedRecordId===savedId||x.id===existing.landlordLinkId);
          if(guest())guestWrite("landlord",ll.filter(x=>!matches.some(y=>y.id===x.id)));
          else await Promise.all(matches.map(x=>deleteDoc(doc(col("landlord"),x.id))));
        }
      }
      if(m==="landlord"){
        const ll=guest()?guestRead("landlord"):await read("landlord");
        const savedLandlord=ll.find(x=>x.id===savedId)||{...data,id:savedId};
        await syncLandlordToExpenseOrAdvance(savedLandlord,savedId);
      }

      closeModal();
      records=await read(m);
      await allData();
      renderModule(m);
      toast("資料儲存成功！");
    }catch(e){
      console.error("saveRecord error",e);
      toast("儲存失敗："+(e?.message||String(e)));
    }finally{
      if(submitButton){submitButton.disabled=false;submitButton.textContent="儲存資料";}
    }
  }

  async function remove(m,id){
    if(!confirm("確定刪除這筆資料？刪除後無法復原。"))return;
    try{
      const current=(guest()?guestRead(m):await read(m)).find(r=>r.id===id);
      if(guest())guestWrite(m,guestRead(m).filter(r=>r.id!==id));
      else await deleteDoc(doc(col(m),id));

      const linkedId=current?.landlordLinkId || current?.linkedRecordId ||
        ((m==="work" && isASPerson(current?.vendorName))?"work_link_"+id:null) ||
        (m==="expenses"?"expense_link_"+id:null) ||
        (m==="advances" && isASPerson(current?.person)?"advance_link_"+id:null);

      if(linkedId){
        if(guest())guestWrite("landlord",guestRead("landlord").filter(r=>r.id!==linkedId && r.linkedRecordId!==id));
        else{
          const linked=(await read("landlord")).filter(r=>r.id===linkedId||r.linkedRecordId===id);
          await Promise.all(linked.map(r=>deleteDoc(doc(col("landlord"),r.id))));
        }
      }

      if(m==="landlord"){
        if(current?.linkedRecordId){
          const colName=current.sourceType==="work"?"work":current.sourceType==="advance"?"advances":(current.sourceType==="expense"?"expenses":((current.category==="AS-奧迪委託施工")?"work":((String(current.item||"").includes("代墊")||String(current.note||"").includes("代墊"))?"advances":"expenses")));
          const tList=guest()?guestRead(colName):await read(colName);
          const target=tList.find(x=>x.id===current.linkedRecordId||x.landlordLinkId===id||x.linkedRecordId===id);
          if(target){
            if(guest())guestWrite(colName,tList.filter(x=>x.id!==target.id));
            else await deleteDoc(doc(col(colName),target.id));
          }
        }
      }

      records=await read(m);
      if(m==="expenses" || m==="work" || m==="advances" || m==="landlord"){
        await allData();
      }
      renderModule(m);
      toast("資料已刪除（連動項目已同步移除）");
    }catch(e){toast("刪除失敗："+e.message);}
  }
}

bootASCoatingSystem().catch(error=>{
  console.error("系統啟動失敗：", error);
  const errBox = document.getElementById("loginError");
  if(errBox) errBox.textContent = "系統載入失敗：" + error.message;
});
