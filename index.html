  function bindInvoiceTools(){
    const im=$("invoiceMonth");
    if(im)im.value=invoiceMonth;
    if(im)im.onchange=e=>{
      invoiceMonth=e.target.value||dashboardMonth;
      makeInvoice();
    };
    const iv=$("invoiceVendor");
    if(iv)iv.onchange=e=>{
      vendorFilter=e.target.value;
      makeInvoice();
    };
    const mi=$("makeInvoice");
    if(mi)mi.onclick=makeInvoice;
    const pi=$("printInvoice");
    if(pi)pi.onclick=()=>{
      makeInvoice();
      setTimeout(()=>window.print(),150);
    };
  }

  function makeInvoice(){
    if(!$("invoiceResult"))return;
    const month=$("invoiceMonth")?.value||dashboardMonth;
    const vendor=$("invoiceVendor")?.value;
    invoiceMonth=month;

    const list=records.filter(r=>isMonth(r,month)&&(!vendor||(r.vendorName||"")===vendor)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const paid=list.filter(r=>r.paymentStatus==="已收");
    const unpaid=list.filter(r=>["未收","月結"].includes(r.paymentStatus));
    const total=sum(list);
    const paidTotal=sum(paid);
    const unpaidTotal=sum(unpaid);

    $("invoiceResult").innerHTML=`
      <div class="panel" id="invoicePrint">
        <div class="print-title"><h2>AS COATING｜施工請款明細</h2></div>
        <h2>AS COATING｜施工請款明細</h2>
        <div class="note">請款月份：${safe(monthName(month))} 請款對象：${safe(vendor||"全部廠商")}</div>
        <div class="summary-grid" style="margin:16px 0">
          <div class="summary-card">本月請款總額<b class="invoice-total">${money(total)}</b></div>
          <div class="summary-card">已收金額<b class="green-text">${money(paidTotal)}</b></div>
          <div class="summary-card">未收／月結<b class="red-text">${money(unpaidTotal)}</b></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>日期</th><th>車牌</th><th>車主</th><th>車款</th><th>施工項目</th><th>金額</th><th>收款狀態</th></tr>
            </thead>
            <tbody>
              ${list.map(r=>`
                <tr>
                  <td>${safe(r.date)}</td><td>${safe(r.plate)}</td><td>${safe(r.owner)}</td><td>${safe(r.car)}</td>
                  <td>${(r.items||[]).map(x=>{
                    const n=x.name==="other_custom"||x.name==="其他施工"?(x.customName||"其他施工"):x.name;
                    return safe(n)+" "+money(x.price);
                  }).join("<br>")}</td>
                  <td>${money(r.amount)}</td><td>${safe(r.paymentStatus)}</td>
                </tr>
              `).join("")||`<tr><td colspan="7" class="empty">這個月份沒有請款資料</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="text-align:right;margin-top:20px;font-size:17px;font-weight:bold">
          請款總額：<span class="invoice-total">${money(total)}</span>
        </div>
      </div>
    `;
  }

  function landlordEffectiveAmount(r){
    const amountValue = Number(r.amount || 0);
    const category = r.category;
    let share = r.share;
    if(category === "水費" || category === "電費"){
      if(share === undefined || share === null || share === "" || isNaN(Number(share))){
        share = category === "水費" ? 50 : 40;
      }
      return amountValue * (Number(share) / 100);
    }
    return amountValue;
  }

  function landlordSummaryHTML(){
    const month=dashboardMonth;
    const list=records.filter(r=>isMonth(r,month));
    const incoming=sum(list.filter(r=>r.direction==="AS-奧迪應付 AS COATING"),landlordEffectiveAmount);
    const outgoing=sum(list.filter(r=>r.direction==="AS COATING 應付 AS-奧迪"),landlordEffectiveAmount);
    const net=incoming-outgoing;

    return `
      <div class="panel">
        <div class="panel-head">
          <h3>月底結算概況</h3>
          <label class="note">
            結算月份
            <input type="month" id="landlordMonth" value="${safe(month)}" style="width:150px">
          </label>
        </div>
        <div class="summary-grid">
          <div class="summary-card">AS-奧迪應付 AS COATING<b class="green-text">${money(incoming)}</b></div>
          <div class="summary-card">AS COATING 應付 AS-奧迪<b class="orange-text">${money(outgoing)}</b></div>
          <div class="summary-card">往來差額<b class="${net>=0?"green-text":"red-text"}">${money(net)}</b></div>
        </div>
        <div class="total-box" style="margin-top:14px">
          <span>本月結算結果</span>
          <strong class="${net>=0?"green-text":"red-text"}">
            ${net>=0?"AS-奧迪應付 AS COATING":"AS COATING 應付 AS-奧迪"} ${money(Math.abs(net))}
          </strong>
        </div>
        <div class="actions" style="margin-top:14px">
          <button class="primary" id="generateStatementBtn">產生對帳結算詳細明細（分三區塊）</button>
        </div>
      </div>
      <div id="statementResultContainer"></div>
    `;
  }

  function bindLandlord(){
    const lm=$("landlordMonth");
    if(lm)lm.onchange=e=>{
      dashboardMonth=e.target.value||dashboardMonth;
      renderModule("landlord");
    };
    const genBtn=$("generateStatementBtn");
    if(genBtn)genBtn.onclick=generateLandlordStatement;

    const form=$("recordForm");
    if(!form)return;
    const category=form.elements.category;
    const share=form.elements.share;
    const item=form.elements.item;

    if(category){
      category.onchange=()=>{
        if(category.value==="水費" && share) share.value=50;
        else if(category.value==="電費" && share) share.value=40;
        else if(share && !share.dataset.userChanged) share.value="";

        if(item && (!item.dataset || !item.dataset.customInput)){
          item.value = category.value || "";
        }
      };
    }

    if(share){
      share.oninput=()=>share.dataset.userChanged="1";
    }

    if(item){
      item.oninput=()=>{
        if(!item.dataset) item.dataset = {};
        item.dataset.customInput = item.value.trim() !== "" ? "1" : "";
      };
    }
  }

  async function upsertLinkedLandlord(linkId,data){
    let list=await read("landlord");
    const old=list.find(x=>x.id===linkId||x.linkedRecordId===data.linkedRecordId);
    const payload={...data,sourceType:data.sourceType||"expense",linkedRecordId:data.linkedRecordId||linkId};
    if(guest()){
      if(old)list=list.map(x=>x.id===linkId?{...x,...payload}:x);
      else list.push({id:linkId,...payload});
      guestWrite("landlord",list);
      return;
    }
    if(old)await updateDoc(doc(col("landlord"),old.id),{...payload,updatedAt:serverTimestamp()});
    else await addDoc(col("landlord"),{...payload,createdAt:serverTimestamp()});
  }

  async function syncExpenseToLandlord(expenseData,expenseId){
    const payee=expenseData.payee;
    const category=expenseData.category;
    const linkId=expenseData.landlordLinkId||("expense_link_"+expenseId);
    if(category!=="水費"&&category!=="電費"&&category!=="房屋租金"&&category!=="停車位費用"&&category!=="大樓管理費"&&category!=="勞健保費"&&!isASPerson(payee))return null;
    const share=category==="水費"?50:category==="電費"?40:100;
    const payload={
      date:expenseData.date,direction:"AS COATING 應付 AS-奧迪",category:category,
      item:expenseData.item||category,amount:Number(expenseData.amount||0),share,
      note:"由支出記帳自動同步｜"+(expenseData.note||""),sourceType:"expense",linkedRecordId:expenseId
    };
    await upsertLinkedLandlord(linkId,payload);
    return linkId;
  }

  async function syncWorkToLandlord(workData,workId){
    const isAS=isASPerson(workData.vendorName);
    const linkId=workData.landlordLinkId||("work_link_"+workId);
    if(!isAS)return null;
    const itemText=(workData.items||[]).map(x=>x.name==="other_custom"||x.name==="其他施工"?(x.customName||x.name):x.name).join("、");
    await upsertLinkedLandlord(linkId,{
      date:workData.date,direction:"AS-奧迪應付 AS COATING",category:"AS-奧迪委託施工",
      item:(workData.plate?workData.plate+"｜":"")+(itemText||"施工服務"),
      amount:Number(workData.amount||0),share:100,
      note:"由工作紀錄自動同步｜"+(workData.note||""),sourceType:"work",linkedRecordId:workId
    });
    return linkId;
  }

  async function syncAdvanceToLandlord(advanceData,advanceId){
    const isAS=isASPerson(advanceData.person);
    if(!isAS)return;
    const linkId=advanceData.landlordLinkId||("advance_link_"+advanceId);
    await upsertLinkedLandlord(linkId,{
      date:advanceData.date,direction:"AS-奧迪應付 AS COATING",category:"其他",
      item:"【代墊請款】"+(advanceData.item||""),amount:Number(advanceData.amount||0),share:100,
      note:"幫奧迪代墊付款，向奧迪請款｜"+(advanceData.note||""),sourceType:"advance",linkedRecordId:advanceId
    });
  }

  async function upsertLinkedTarget(colName, linkId, payload){
    let list = guest() ? guestRead(colName) : await read(colName);
    let old = list.find(x => x.id === linkId || x.landlordLinkId === linkId || x.linkedRecordId === linkId);
    if(guest()){
      if(old) list = list.map(x => (x.id === old.id || x.landlordLinkId === linkId || x.linkedRecordId === linkId ? {...x, ...payload} : x));
      else list.push({id: linkId, landlordLinkId: linkId, linkedRecordId: linkId, ...payload});
      guestWrite(colName, list);
    } else {
      if(old) await updateDoc(doc(col(colName), old.id), {...payload, updatedAt: serverTimestamp()});
      else await addDoc(col(colName), {landlordLinkId: linkId, linkedRecordId: linkId, ...payload, createdAt: serverTimestamp()});
    }
  }

  async function syncLandlordToExpenseOrAdvance(landlordData, landlordId){
    const itemText = landlordData.item || landlordData.category || "";
    const isAdvance = landlordData.direction === "AS-奧迪應付 AS COATING" || itemText.includes("代墊") || (landlordData.note || "").includes("代墊");
    const linkId = landlordData.linkedRecordId || ("target_link_" + landlordId);

    const finalAmount = Number(landlordData.amount || 0);

    if(isAdvance){
      const payload = {
        date: landlordData.date,
        item: itemText,
        amount: finalAmount,
        person: "AS-奧迪",
        status: "待收回",
        note: "由 AS-奧迪往來結算同步｜" + (landlordData.note || ""),
        landlordLinkId: landlordId,
        linkedRecordId: landlordId
      };
      await upsertLinkedTarget("advances", linkId, payload);
      await cleanUnmatchedTarget("expenses", landlordId);
    } else {
      const payload = {
        date: landlordData.date,
        category: landlordData.category || "其他",
        item: itemText,
        amount: finalAmount,
        payee: "AS-奧迪",
        paymentMethod: "現金",
        paid: "未付款",
        note: "由 AS-奧迪往來結算同步｜" + (landlordData.note || ""),
        landlordLinkId: landlordId,
        linkedRecordId: landlordId
      };
      await upsertLinkedTarget("expenses", linkId, payload);
      await cleanUnmatchedTarget("advances", landlordId);
    }
  }

  async function cleanUnmatchedTarget(colName, landlordId){
    let list = guest() ? guestRead(colName) : await read(colName);
    const old = list.filter(x => x.landlordLinkId === landlordId || x.linkedRecordId === landlordId || x.id === ("target_link_" + landlordId));
    if(old.length > 0){
      if(guest()){
        list = list.filter(x => !(x.landlordLinkId === landlordId || x.linkedRecordId === landlordId || x.id === ("target_link_" + landlordId)));
        guestWrite(colName, list);
      } else {
        await Promise.all(old.map(r => deleteDoc(doc(col(colName), r.id))));
      }
    }
  }

  function generateLandlordStatement(){
    const month = dashboardMonth;
    const list = records.filter(r => isMonth(r, month));

    const deductionItems = list.filter(r => 
      r.direction === "AS COATING 應付 AS-奧迪"
    );

    const workItems = list.filter(r => 
      r.sourceType === "work" || 
      r.category === "AS-奧迪委託施工" || 
      (r.id && String(r.id).startsWith("work_link_"))
    );

    const advanceItems = list.filter(r => 
      r.direction === "AS-奧迪應付 AS COATING" && 
      !workItems.includes(r)
    );

    const calcSubtotal = (arr) => sum(arr, r => landlordEffectiveAmount(r));

    const renderTable = (title, items, isWork=false) => `
      <div style="margin-bottom:20px;">
        <h4 style="margin:0 0 8px; color:#526b5c; border-bottom:2px solid #e8e6df; padding-bottom:4px;">${title}（共 ${items.length} 筆）</h4>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                ${isWork?`<th>車款</th><th>車色</th><th>車牌</th><th>施工項目</th>`:`<th>項目類別</th><th>項目說明</th><th>原始金額</th><th>分擔比例</th><th>應負擔金額</th>`}
                <th>金額/備註</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(r => {
                if(isWork){
                  let car = r.car || "—";
                  let carColor = r.carColor || "—";
                  let plate = r.plate || "—";
                  let itemStr = r.item || "";

                  if(r.linkedRecordId) {
                    const workRec = (guest() ? guestRead("work") : records).find(x => x.id === r.linkedRecordId);
                    if(workRec) {
                      if(workRec.car) car = workRec.car;
                      if(workRec.carColor) carColor = workRec.carColor;
                      if(workRec.plate) plate = workRec.plate;
                      if(Array.isArray(workRec.items) && workRec.items.length > 0) {
                        itemStr = workRec.items.map(x => (x.name === "other_custom" || x.name === "其他施工") ? (x.customName || "其他施工") : x.name).join("、");
                      }
                    }
                  }

                  return `
                    <tr>
                      <td>${safe(r.date)}</td>
                      <td>${safe(car)}</td>
                      <td>${safe(carColor)}</td>
                      <td>${safe(plate)}</td>
                      <td>${safe(itemStr || r.item || "施工服務")}</td>
                      <td><b>${money(r.amount)}</b></td>
                    </tr>
                  `;
                }else{
                  const rawAmt = Number(r.amount || 0);
                  let share = r.share || (r.category==="水費"?50:r.category==="電費"?40:100);
                  return `
                    <tr>
                      <td>${safe(r.date)}</td>
                      <td>${safe(r.category)}</td>
                      <td>${safe(r.item)}</td>
                      <td>${money(rawAmt)}</td>
                      <td>${r.category==="水費"||r.category==="電費"?share+"%":"—"}</td>
                      <td><b>${money(landlordEffectiveAmount(r))}</b></td>
                    </tr>
                  `;
                }
              }).join("") || `<tr><td colspan="7" class="empty">此區塊無相關紀錄</td></tr>`}
            </tbody>
          </table>
        </div>
        <div style="text-align:right; margin-top:6px; font-weight:bold;">
          ${title}小計：<span class="green-text">${money(calcSubtotal(items))}</span>
        </div>
      </div>
    `;

    const container = $("statementResultContainer");
    if(!container) return;

    container.innerHTML = `
      <div class="panel" style="background:#fff; border:2px dashed #71877b;">
        <div class="panel-head">
          <h3>AS COATING ＆ 奧迪 — ${safe(monthName(month))} 往來對帳結算明細</h3>
          <button class="secondary mini no-print" id="printStatementBtn">列印／截圖對帳單</button>
        </div>
        ${renderTable("一、應付款項", deductionItems, false)}
        ${renderTable("二、AS 工作紀錄項目", workItems, true)}
        ${renderTable("三、代墊項目", advanceItems, false)}
      </div>
    `;

    const pb = $("printStatementBtn");
    if(pb)pb.onclick = () => window.print();
    container.scrollIntoView({behavior:"smooth", block:"start"});
  }

  async function save(e){
    e.preventDefault();
    const m=page;
    const form=e.target;
    let data={};

    if(m==="work"){
      bindWorkItems();
      data = getWorkData(form);
      if(data.amount<0){
        toast("施工總金額不可為負數。");
        return;
      }
      if(data.paymentMethod==="匯款"&&!/^\d{5}$/.test(data.transferLast5)){
        toast("匯款方式請填寫五碼帳號末五碼。");
        return;
      }
    }else{
      FIELDS[m].forEach(f=>{
        const el=form.elements[f.key];
        if(!el) return;
        data[f.key]= f.type==="checkbox"?el.checked: f.type==="number"?Number(el.value||0):(el.value ? el.value.trim() : "");
      });
    }

    if((m==="expenses"&&isASPerson(data.payee)) || (m==="advances"&&isASPerson(data.person))){
      if(m==="expenses")data.payee="AS-奧迪";
      if(m==="advances")data.person="AS-奧迪";
    }

    if(m==="landlord"){
      if(data.category==="水費"&&(data.share===0||data.share===""))data.share=50;
      if(data.category==="電費"&&(data.share===0||data.share===""))data.share=40;
    }

    try{
      let savedId=editing;
      if(guest()){
        let list=guestRead(m);
        if(editing){
          list=list.map(r=>r.id===editing?{...r,...data}:r);
        }else{
          savedId="guest_"+Date.now();
          list.push({id:savedId,...data});
        }
        guestWrite(m,list);
      }else{
        const c=col(m);
        if(editing && !records.some(r=>r.id===editing)){
          editing = null;
        }

        if(editing){
          await updateDoc(doc(c,editing),{...data,updatedAt:serverTimestamp()});
        }else{
          const ref=await addDoc(c,{...data,createdAt:serverTimestamp()});
          savedId=ref.id;
        }
      }

      if(m==="work" && isASPerson(data.vendorName)){
        const linked=await syncWorkToLandlord(data,savedId);
        if(linked){
          if(guest())guestWrite("work",guestRead("work").map(r=>r.id===savedId?{...r,landlordLinkId:linked}:r));
          else await updateDoc(doc(col("work"),savedId),{landlordLinkId:linked});
        }
      }
      if(m==="expenses"){
        const linked=await syncExpenseToLandlord(data,savedId);
        if(linked){
          if(guest())guestWrite("expenses",guestRead("expenses").map(r=>r.id===savedId?{...r,landlordLinkId:linked}:r));
          else await updateDoc(doc(col("expenses"),savedId),{landlordLinkId:linked});
        }
      }
      if(m==="advances"){
        await syncAdvanceToLandlord(data,savedId);
      }
      if(m==="landlord"){
        await syncLandlordToExpenseOrAdvance(data, savedId);
      }

      editing=null;
      records=await read(m);
      await allData();
      renderModule(m);
      toast("資料儲存成功！");
    }catch(e){
      toast("儲存失敗："+e.message);
    }
  }

  async function edit(m,id){
    editing=id;
    renderModule(m);
  }

  async function remove(m,id){
    if(!confirm("確定刪除這筆資料？刪除後無法復原。"))return;
    try{
      const current=(guest()?guestRead(m):await read(m)).find(r=>r.id===id);
      if(guest())guestWrite(m,guestRead(m).filter(r=>r.id!==id));
      else await deleteDoc(doc(col(m),id));

      const linkedId=current?.landlordLinkId ||
        ((m==="work" && isASPerson(current?.vendorName))?"work_link_"+id:null) ||
        (m==="expenses"?"expense_link_"+id:null) ||
        (m==="advances" && isASPerson(current?.person)?"advance_link_"+id:null);

      if(linkedId){
        if(guest())guestWrite("landlord",guestRead("landlord").filter(r=>r.id!==linkedId && r.linkedRecordId!==id));
        else{
          const linked=(await read("landlord")).filter(r=>r.id===linkedId||r.linkedRecordId===id);
          await Promise.all(linked.map(r=>deleteDoc(doc(col("landlord"),r.id))));
        }
      }
      records=await read(m);
      if(m==="expenses" || m==="work" || m==="advances"){
        await allData();
      }
      renderModule(m);
      toast("資料已刪除（連動項目已同步移除）");
    }catch(e){toast("刪除失敗："+e.message);}
  }
}

bootASCoatingSystem().catch(error=>{
  console.error("系統啟動失敗：", error);
  const errBox = document.getElementById("loginError");
  if(errBox) errBox.textContent = "系統載入失敗：" + error.message;
});
</script>
